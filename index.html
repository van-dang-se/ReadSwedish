<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Svenska i fokus</title>
  <style>
    :root{--ink:#162321;--muted:#66736f;--paper:#fbfaf5;--green:#176b57;--dark:#0f4e40;--mint:#dceee5;--line:#dce4df;--yellow:#f5c45f}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Georgia,'Times New Roman',serif;background:radial-gradient(circle at 8% 12%,#f5c45f40,transparent 24rem),linear-gradient(135deg,#f6f0e3,#e8f1eb 48%,#f8f7f1);min-height:100vh}button,textarea{font:inherit}button{cursor:pointer}.shell{width:min(1080px,calc(100% - 32px));margin:auto;padding:42px 0 72px}.masthead{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:28px;animation:rise .55s ease both}.eyebrow{margin:0 0 10px;color:var(--green);font:700 .76rem/1.2 Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase}h1{max-width:680px;margin:0 0 10px;font-size:clamp(2.5rem,7vw,5.3rem);font-weight:400;line-height:.94;letter-spacing:-.04em}.intro{max-width:520px;margin:0;color:var(--muted);font-size:1.08rem;line-height:1.55}.mark{display:grid;flex:0 0 auto;place-items:center;width:76px;height:76px;border:1px solid #176b5733;border-radius:50%;color:var(--green);font-size:2rem;transform:rotate(8deg);background:#ffffff80}.workspace{display:grid;grid-template-columns:minmax(0,1fr) .72fr;gap:18px;align-items:start}.input-panel,.results-panel{border:1px solid #bcccc4cc;border-radius:18px;background:#ffffffdb;box-shadow:0 18px 50px #1d3a3014;backdrop-filter:blur(12px)}.input-panel,.results-panel{padding:24px}.results-panel{min-height:300px}.panel-label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;color:var(--dark);font:700 .76rem/1.2 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}textarea{display:block;width:100%;min-height:260px;padding:18px;resize:vertical;border:1px solid var(--line);border-radius:12px;outline:0;color:var(--ink);background:#ffffffbf;font-size:1.18rem;line-height:1.55}textarea:focus{border-color:var(--green);box-shadow:0 0 0 4px #176b571a}textarea::placeholder{color:#a3ada8}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.primary,.secondary{min-height:46px;border:0;border-radius:9px;padding:0 18px;font:700 .92rem/1 Arial,sans-serif;transition:transform .2s,background .2s}.primary{flex:1 1 220px;color:#fff;background:var(--green)}.secondary{color:var(--dark);background:var(--mint)}.primary:hover,.secondary:hover{transform:translateY(-2px)}.primary:hover{background:var(--dark)}button:disabled{cursor:wait;opacity:.6;transform:none}#status{min-height:22px;margin:14px 0 0;color:var(--green);font:700 .82rem/1.4 Arial,sans-serif}.empty{padding:42px 10px;color:var(--muted);text-align:center;line-height:1.6}.empty strong{display:block;margin-bottom:6px;color:var(--ink);font-size:1.25rem;font-weight:400}.section-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px}h2{margin:0;font-size:1.55rem;font-weight:400}.section-heading span{color:var(--muted);font:.78rem Arial,sans-serif}.line-card,.vocab-card{margin-bottom:10px;padding:15px 17px;border:1px solid var(--line);border-radius:12px;background:#ffffffb8;animation:rise .35s ease both}.sv-line,.vocab-header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.sv-line{color:var(--ink);font-weight:700;line-height:1.45}.en-line{margin-top:9px;padding-left:12px;border-left:2px solid var(--yellow);color:var(--muted);font-style:italic;line-height:1.45}.speak-btn{flex:0 0 auto;border:1px solid var(--line);border-radius:7px;padding:6px 9px;color:var(--dark);background:#f5f8f4;font:.75rem Arial,sans-serif}.speak-btn:hover{background:var(--mint)}.vocab-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.vocab-card{margin:0}.vocab-term{color:var(--green);font-size:1.15rem;font-weight:700}.vocab-meaning{color:var(--muted);font-size:.95rem}.vocab-usage{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem;line-height:1.45}.vocab-usage strong{color:var(--ink)}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(max-width:760px){.shell{width:min(100% - 22px,620px);padding-top:26px}.masthead{align-items:flex-start}.mark{width:56px;height:56px;font-size:1.5rem}.workspace{grid-template-columns:1fr}.results-panel{min-height:0}}@media(max-width:480px){.input-panel,.results-panel{padding:17px;border-radius:14px}.vocab-list{grid-template-columns:1fr}.actions{flex-direction:column}.primary,.secondary{width:100%}}
  @media(max-width:900px){.shell{width:min(100% - 28px,680px);padding:30px 0 48px}.masthead{margin-bottom:20px}.workspace{grid-template-columns:1fr;gap:14px}.input-panel,.results-panel{padding:18px;border-radius:15px}.results-panel{min-height:0}.empty{padding:28px 10px}.mark{width:60px;height:60px;font-size:1.6rem}textarea{min-height:210px}}
  @media(max-width:480px){h1{font-size:clamp(2.45rem,13vw,3.5rem)}.intro{font-size:1rem}.shell{width:calc(100% - 24px);padding-top:22px}.masthead{gap:10px}.mark{width:48px;height:48px;font-size:1.3rem}.input-panel,.results-panel{padding:15px;border-radius:13px}.panel-label{font-size:.68rem}textarea{min-height:190px;padding:14px;font-size:1.05rem}.actions{gap:8px}.primary,.secondary{min-height:40px;width:auto;padding:0 13px;font-size:.82rem}.primary{flex:0 1 auto}.vocab-list{grid-template-columns:1fr}}
    .image-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}.upload-control{position:relative;display:inline-flex}.upload-control input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer}.secondary.upload-btn{display:inline-flex;align-items:center;justify-content:center}.camera-hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}.status-note{margin:10px 0 0;color:var(--muted);font-size:.92rem;line-height:1.4}
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead"><div><p class="eyebrow">Läs svenska, lite i taget</p><h1>Från text till förståelse.</h1><p class="intro">Översätt din svenska rad för rad och plocka upp orden som är värda att bära med sig.</p></div><div class="mark" aria-hidden="true">Å</div></header>
    <section class="workspace" aria-label="Översättningsverktyg">
      <div class="input-panel"><label class="panel-label" for="inputText"><span>Din svenska text</span><span id="charCount">0 tecken</span></label><textarea id="inputText" placeholder="Klistra in en svensk text här..." spellcheck="true"></textarea><div class="image-tools"><div class="upload-control"><input id="imageInput" type="file" accept="image/*" capture="environment" aria-label="Lägg till bild eller ta foto"><button class="secondary upload-btn" id="photoButton" type="button">Ta foto</button></div><button class="secondary" id="clearButton" type="button">Rensa</button></div><video id="cameraVideo" class="camera-hidden" playsinline muted autoplay></video><canvas id="cameraCanvas" class="camera-hidden"></canvas><div class="actions"><button class="primary" id="processButton" type="button">Översätt & hitta ord</button><button class="secondary" id="speakAllButton" type="button">Läs upp texten</button></div><p id="status" role="status" aria-live="polite"></p></div>
      <section class="results-panel" aria-labelledby="translationHeading"><div class="panel-label"><span id="translationHeading">Översättning</span><span id="lineCount"></span></div><div id="results"><div class="empty"><strong>Din översättning hamnar här.</strong>Varje rad får sin engelska motsvarighet och ett uttal du kan lyssna på.</div></div></section>
    </section>
    <section id="vocab-section" hidden aria-labelledby="vocabHeading"><div class="section-heading"><h2 id="vocabHeading">Nya ord</h2><span>De längsta orden i texten</span></div><div id="vocab-list" class="vocab-list"></div></section>
  </main>
  <script>
    const STOP_WORDS=new Set('och i att en ett som det på med för av till är var har men om inte den de ska kan eller nu så min din sin hans hennes deras vår er man vad hur när där här vem vilken vilket vilka sig dem oss mig dig han hon vi ni du också efter under över mot från utan bara blir blev skulle hade alla andra varit många mycket varje dessa detta'.split(' '));
    const input=document.getElementById('inputText'),status=document.getElementById('status'),processButton=document.getElementById('processButton'),vocabSection=document.getElementById('vocab-section'),imageInput=document.getElementById('imageInput'),photoButton=document.getElementById('photoButton'),clearButton=document.getElementById('clearButton'),cameraVideo=document.getElementById('cameraVideo'),cameraCanvas=document.getElementById('cameraCanvas');
    let ocrReady=false;
    input.addEventListener('input',()=>document.getElementById('charCount').textContent=`${input.value.length} tecken`);
    async function ensureOcrLoaded(){if(window.Tesseract){ocrReady=true;return}status.textContent='Laddar OCR-funktion för bilder...';await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';script.onload=()=>{ocrReady=true;resolve();};script.onerror=()=>reject(new Error('Kunde inte ladda OCR-biblioteket.'));document.head.appendChild(script);});}
    function applyExtractedText(text){const trimmed=text.trim();if(!trimmed){status.textContent='Ingen text hittades i bilden.';return}const previous=input.value.trim();input.value=previous?`${previous}\n\n${trimmed}`:trimmed;input.dispatchEvent(new Event('input'));status.textContent='Text från bilden har lagts in i fältet. Klicka på "Översätt & hitta ord" när du är redo.';}
    function preprocessImageFile(file){
      return new Promise((resolve,reject)=>{
        const img=new Image();
        const url=URL.createObjectURL(file);
        img.onload=()=>{
          try{
            const canvas=document.createElement('canvas');
            const ctx=canvas.getContext('2d');
            const maxSide=1800;
            const scale=Math.min(1, maxSide/Math.max(img.width,img.height));
            canvas.width=Math.max(1,Math.round(img.width*scale));
            canvas.height=Math.max(1,Math.round(img.height*scale));
            ctx.filter='contrast(1.4) saturate(1.1) brightness(1.08)';
            ctx.drawImage(img,0,0,canvas.width,canvas.height);
            const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
            const data=imageData.data;
            for(let i=0;i<data.length;i+=4){
              const r=data[i],g=data[i+1],b=data[i+2];
              const gray=0.299*r+0.587*g+0.114*b;
              let value=gray;
              if(value<120){value=0;}else if(value>200){value=255;}else{value=Math.round((gray-120)/80*255);} 
              data[i]=data[i+1]=data[i+2]=value;
            }
            ctx.putImageData(imageData,0,0);
            canvas.toBlob(blob=>{
              URL.revokeObjectURL(url);
              if(blob){resolve(new File([blob], file.name || 'processed-image.png', {type:'image/png'}));}
              else{reject(new Error('Image preprocessing failed'));}
            },'image/png',0.92);
          }catch(error){
            URL.revokeObjectURL(url);
            reject(error);
          }
        };
        img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Image load failed'));};
        img.src=url;
      });
    }
    async function extractTextFromImage(file){
      await ensureOcrLoaded();
      const processedFile=await preprocessImageFile(file);
      const {data}=await Tesseract.recognize(processedFile,'swe',{logger:message=>{if(message.status==='recognizing text'){status.textContent=`Läser text från bilden… ${Math.round(message.progress*100)}%`;}}});
      return data.text||'';
    }
    async function captureFromCamera(){
      if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
        imageInput.setAttribute('capture','environment');
        imageInput.click();
        return;
      }
      try{
        status.textContent='Öppnar kameran…';
        const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
        cameraVideo.srcObject=stream;
        await cameraVideo.play();
        const width=cameraVideo.videoWidth||1280;
        const height=cameraVideo.videoHeight||720;
        cameraCanvas.width=width;
        cameraCanvas.height=height;
        const context=cameraCanvas.getContext('2d');
        context.drawImage(cameraVideo,0,0,width,height);
        const blob=await new Promise(resolve=>cameraCanvas.toBlob(resolve,'image/png'));
        const file=new File([blob],'camera-shot.png',{type:'image/png'});
        stream.getTracks().forEach(track=>track.stop());
        const text=await extractTextFromImage(file);
        applyExtractedText(text);
      }catch(error){
        status.textContent='Kameran kunde inte öppnas. Försök igen eller välj en bild från galleriet.';
      }
    }
    photoButton.addEventListener('click',()=>{
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        captureFromCamera();
      } else {
        imageInput.removeAttribute('capture');
        imageInput.click();
      }
    });
    clearButton.addEventListener('click',()=>{input.value='';input.dispatchEvent(new Event('input'));imageInput.value='';imageInput.removeAttribute('capture');status.textContent='Textfältet har rensats.';});
    imageInput.addEventListener('change',async(event)=>{
      const file=event.target.files&&event.target.files[0];
      if(!file){return}
      if(!file.type.startsWith('image/')){
        status.textContent='Välj en bildfil i JPG, PNG eller liknande format.';
        return;
      }
      try{
        const text=await extractTextFromImage(file);
        applyExtractedText(text);
      }catch(error){
        status.textContent='Det gick inte att läsa text från bilden. Försök med en tydligare bild.';
      }
    });
    function speakSwedish(text){if(!('speechSynthesis' in window)){status.textContent='Uppläsning stöds inte i den här webbläsaren.';return}window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='sv-SE';utterance.rate=.9;window.speechSynthesis.speak(utterance)}
    document.getElementById('speakAllButton').addEventListener('click',()=>{const text=input.value.trim();if(text)speakSwedish(text);else status.textContent='Skriv eller klistra in text först.'});
    function createButton(label,text){const button=document.createElement('button');button.className='speak-btn';button.type='button';button.textContent=label;button.addEventListener('click',()=>speakSwedish(text));return button}
    async function translateSingleChunk(text){if(!text)return '';try{const response=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=sv&tl=en&dt=t&q=${encodeURIComponent(text)}`);if(response.ok){const data=await response.json();if(data&&data[0])return data[0].map(item=>item[0]).join('')}}catch(error){}try{const response=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=sv|en`);const data=await response.json();return data.responseData?.translatedText||text}catch(error){return text}}
    const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    async function extractVocabulary(fullText){const sentences=fullText.match(/[^.!?]+[.!?]+/g)||[fullText];const words=fullText.replace(/[.,/#!$%^&*;:{}=\-_`~()?'"’]/g,'').split(/\s+/);const candidates=[];const seen=new Set();words.forEach(word=>{const clean=word.toLowerCase().trim();if(clean.length>=5&&!STOP_WORDS.has(clean)&&!seen.has(clean)&&Number.isNaN(Number(clean))){seen.add(clean);candidates.push(clean)}});candidates.sort((a,b)=>b.length-a.length);const topWords=candidates.slice(0,10);if(!topWords.length)return;vocabSection.hidden=false;const list=document.getElementById('vocab-list');for(const word of topWords){const translation=await translateSingleChunk(word);const sentence=sentences.find(item=>new RegExp(`\\b${word}\\b`,'i').test(item))||fullText.slice(0,120);const card=document.createElement('article');card.className='vocab-card';const header=document.createElement('div');header.className='vocab-header';const term=document.createElement('div');term.innerHTML='<span class="vocab-term"></span> <span aria-hidden="true">&mdash;</span> <span class="vocab-meaning"></span>';term.querySelector('.vocab-term').textContent=word;term.querySelector('.vocab-meaning').textContent=translation;header.append(term,createButton('Läs ord',word));const usage=document.createElement('div');usage.className='vocab-usage';usage.innerHTML='<strong>Användning i texten:</strong> ';usage.append(document.createTextNode(`"${sentence.trim()}"`));card.append(header,usage);list.appendChild(card);await wait(50)}}
    async function processAll(){const rawText=input.value;const lines=rawText.split('\n').map(line=>line.trim()).filter(Boolean);if(!lines.length){status.textContent='Skriv eller klistra in text först.';return}processButton.disabled=true;vocabSection.hidden=true;document.getElementById('results').replaceChildren();document.getElementById('vocab-list').replaceChildren();document.getElementById('lineCount').textContent=`${lines.length} ${lines.length===1?'rad':'rader'}`;for(let index=0;index<lines.length;index++){status.textContent=`Översätter rad ${index+1} av ${lines.length}...`;const translation=await translateSingleChunk(lines[index]);const card=document.createElement('article');card.className='line-card';const original=document.createElement('div');original.className='sv-line';original.append(document.createTextNode(lines[index]),createButton('Läs',lines[index]));const translated=document.createElement('div');translated.className='en-line';translated.textContent=translation;card.append(original,translated);document.getElementById('results').appendChild(card);await wait(70)}status.textContent='Hittar de 10 svåraste orden...';await extractVocabulary(rawText);status.textContent='Översättning och vokabulär klar.';processButton.disabled=false}
    processButton.addEventListener('click',processAll);
  </script>
</body>
</html>
